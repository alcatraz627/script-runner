<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128" role="img" aria-label="Pixel-art spreadsheet feeding a bar chart">
  <rect width="64" height="64" fill="#1b1f24"/>

  <!-- sheet: header row -->
  <rect x="4"  y="6"  width="8" height="6" fill="#3fb950"/>
  <rect x="14" y="6"  width="8" height="6" fill="#3fb950"/>
  <rect x="24" y="6"  width="8" height="6" fill="#3fb950"/>

  <!-- sheet: data rows -->
  <rect x="4"  y="14" width="8" height="6" fill="#30363d"/>
  <rect x="14" y="14" width="8" height="6" fill="#30363d"/>
  <rect x="24" y="14" width="8" height="6" fill="#484f58"/>
  <rect x="4"  y="22" width="8" height="6" fill="#30363d"/>
  <rect x="14" y="22" width="8" height="6" fill="#484f58"/>
  <rect x="24" y="22" width="8" height="6" fill="#30363d"/>
  <rect x="4"  y="30" width="8" height="6" fill="#484f58"/>
  <rect x="14" y="30" width="8" height="6" fill="#30363d"/>
  <rect x="24" y="30" width="8" height="6" fill="#30363d"/>

  <!-- arrow: transform -->
  <rect x="36" y="20" width="6" height="4" fill="#58a6ff"/>
  <rect x="42" y="20" width="4" height="4" fill="#58a6ff"/>
  <rect x="44" y="16" width="4" height="4" fill="#58a6ff"/>
  <rect x="44" y="24" width="4" height="4" fill="#58a6ff"/>

  <!-- one clean output column -->
  <rect x="40" y="36" width="20" height="4" fill="#3fb950"/>
  <rect x="40" y="42" width="20" height="4" fill="#484f58"/>
  <rect x="40" y="48" width="20" height="4" fill="#484f58"/>
  <rect x="40" y="54" width="20" height="4" fill="#484f58"/>

  <!-- rows collapsing in -->
  <rect x="4"  y="40" width="8" height="4" fill="#30363d"/>
  <rect x="14" y="40" width="8" height="4" fill="#30363d"/>
  <rect x="4"  y="48" width="8" height="4" fill="#30363d"/>
  <rect x="14" y="48" width="8" height="4" fill="#30363d"/>
  <rect x="26" y="44" width="10" height="4" fill="#58a6ff"/>
</svg>
